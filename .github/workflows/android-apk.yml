name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # only used to attach the APK to a GitHub Release on v* tags

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LISPO_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Logic tests
        run: npm test

      - name: Generate native Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.LISPO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/lispo-release.keystore"
            echo "LISPO_KEYSTORE_PATH=$RUNNER_TEMP/lispo-release.keystore" >> "$GITHUB_ENV"
            echo "Signing with your release keystore."
          else
            echo "::warning::LISPO_KEYSTORE_BASE64 secret not set. Building with the debug key. Each build may need an uninstall before installing."
          fi

      - name: Build release APK
        working-directory: android
        env:
          LISPO_KEYSTORE_PASSWORD: ${{ secrets.LISPO_KEYSTORE_PASSWORD }}
          LISPO_KEY_ALIAS: ${{ secrets.LISPO_KEY_ALIAS }}
          LISPO_KEY_PASSWORD: ${{ secrets.LISPO_KEY_PASSWORD }}
        # arm64-v8a only: covers every modern phone, ~4x faster build, smaller APK.
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon

      - name: Rename APK
        id: apk
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          NAME="lispo-${VERSION}-build${{ github.run_number }}.apk"
          cp android/app/build/outputs/apk/release/app-release.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.name }}
          retention-days: 30

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.apk.outputs.name }}
